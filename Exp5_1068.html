<!DOCTYPE html>
<html>
<head>
<title>Vitality Now | Wellness Tools</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: georgia, garamond, serif;
}

body {
    background-color: #e8f5e9;
}

.hero-banner {
    background-color: #2c5e3b;
    height: 180px;
    text-align: center;
    padding-top: 40px;
}

.hero-banner h1 {
    color: white;
    text-shadow: 4px 4px 8px black;
    letter-spacing: 5px;
    font-size: xx-large;
}

.hero-banner p {
    color: #d9ead3;
    font-style: italic;
    margin-top: 10px;
}

.nav-bar {
    background-color: #1b3823;
    text-align: center;
    padding-top: 18px;
    padding-bottom: 18px;
}

.nav-bar a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: large;
    padding: 10px 25px;
}

.nav-bar a:hover {
    background-color: #4ca165;
}

.tools {
    width: 70%;
    margin: 40px auto;
}

.tools h2 {
    text-align: center;
    color: #2c5e3b;
    letter-spacing: 2px;
    margin-bottom: 30px;
}

.tool-card {
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
    margin-bottom: 30px;
}

.tool-card h3 {
    color: #2c5e3b;
    margin-bottom: 15px;
}

.tool-card p {
    color: #333333;
    margin-top: 10px;
}

button {
    background-color: #2c5e3b;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    font-size: medium;
    margin-right: 10px;
    margin-top: 10px;
    cursor: pointer;
}

button:hover {
    background-color: #1b3823;
}

.mood-btn.active {
    background-color: #4ca165;
}

label {
    display: block;
    font-weight: bold;
    color: #333333;
    margin-top: 10px;
}

input[type=number] {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #cccccc;
    border-radius: 5px;
}

.footer {
    background-color: #1b3823;
    text-align: center;
    padding-top: 25px;
    padding-bottom: 25px;
}

.footer p {
    color: white;
    font-size: small;
    letter-spacing: 2px;
}
</style>
</head>
<body>

<div class="hero-banner">
    <h1>VITALITY NOW</h1>
    <p>Interactive Wellness Tools</p>
</div>

<div class="nav-bar">
    <a href="#">Home</a>
    <a href="#">Nutrition</a>
    <a href="#">Fitness</a>
    <a href="#">Mindset</a>
</div>

<section class="tools">
    <h2>Track Your Wellness</h2>

    <div class="tool-card" id="waterCard">
        <h3>Water Intake Tracker</h3>
        <p>Glasses today: <span id="waterCount">0</span></p>
        <button id="addGlass">+ Add Glass</button>
        <button id="resetWater">Reset</button>
    </div>

    <div class="tool-card" id="moodCard">
        <h3>Mood Check-In</h3>
        <div>
            <button class="mood-btn" data-mood="Happy">Happy</button>
            <button class="mood-btn" data-mood="Calm">Calm</button>
            <button class="mood-btn" data-mood="Stressed">Stressed</button>
            <button class="mood-btn" data-mood="Tired">Tired</button>
        </div>
        <p id="moodMessage">Select how you feel today.</p>
    </div>

    <div class="tool-card" id="bmiCard">
        <h3>BMI Calculator</h3>
        <label>Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter weight">
        <label>Height (m)</label>
        <input type="number" id="height" placeholder="Enter height">
        <button id="calcBmi">Calculate BMI</button>
        <p>Your BMI: <span id="bmiScore">-</span></p>
        <p>Category: <span id="bmiType">-</span></p>
    </div>
</section>

<div class="footer">
    <p>Vitality Now Health &amp; Wellness Blog</p>
</div>

<script>
var waterCount = 0;
var waterCountEl = document.getElementById("waterCount");

document.getElementById("addGlass").addEventListener("click", function() {
    waterCount++;
    waterCountEl.innerHTML = waterCount;
});

document.getElementById("resetWater").addEventListener("click", function() {
    waterCount = 0;
    waterCountEl.innerHTML = waterCount;
});

var moodButtons = document.querySelectorAll(".mood-btn");
var moodMessage = document.getElementById("moodMessage");

moodButtons.forEach(function(btn) {
    btn.addEventListener("click", function() {
        var active = document.getElementsByClassName("active");
        while (active.length > 0) {
            active[0].classList.remove("active");
        }
        btn.classList.add("active");
        moodMessage.innerHTML = "You are feeling " + btn.getAttribute("data-mood") + " today.";
    });
});

document.getElementById("calcBmi").addEventListener("click", function() {
    var weight = parseFloat(document.getElementById("weight").value);
    var height = parseFloat(document.getElementById("height").value);
    var bmi = weight / (height * height);
    var type = "";
    if (bmi < 18) {
        type = "Underweight";
    } else if (bmi < 25) {
        type = "Normal";
    } else if (bmi < 30) {
        type = "Overweight";
    } else {
        type = "Obese";
    }
    document.getElementById("bmiScore").innerHTML = bmi.toFixed(1);
    document.getElementById("bmiType").innerHTML = type;
});

var cards = document.querySelectorAll(".tool-card");
cards.forEach(function(card) {
    card.addEventListener("mouseover", function() {
        card.style.boxShadow = "0 0 20px rgba(44,94,59,0.5)";
    });
    card.addEventListener("mouseout", function() {
        card.style.boxShadow = "0 0 10px rgba(0,0,0,0.15)";
    });
});
</script>

</body>
</html>
